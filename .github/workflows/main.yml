name: ROS Qt Creator plugin build and archive release

on:
  push:
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]


jobs:
  build:
    name: build (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      matrix:
        config:
          - { name: "Linux", os: ubuntu-22.04, build: "RelWithDebInfo" }
          - { name: "Linux-arm64", os: ubuntu-24.04-arm, build: "RelWithDebInfo" }
          - { name: "Windows", os: windows-latest, msvc_arch: amd64, build: "Release" }
          - { name: "Windows-arm64", os: windows-11-arm, msvc_arch: arm64, build: "Release" }
          - { name: "macOS", os: macos-14, build: "Release" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install Microsoft Visual C++ (Windows)
        uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.config.msvc_arch }}

      - name: install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install --no-install-recommends libgl1-mesa-dev ninja-build libutf8proc-dev libcups2-dev
          sudo apt install --no-install-recommends desktop-file-utils

      - name: install Windows system dependencies
        if: runner.os == 'Windows'
        run: |
          choco install ninja

      - name: install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: install Qt and Qt Creator
        shell: bash
        run: |
          pip install pyyaml requests py7zr tqdm_loggable
          python install-sdk.py --export_variables
          cat env >> $GITHUB_ENV

      - name: build plugin
        run: |
          cmake -B build -GNinja -DCMAKE_BUILD_TYPE=${{ matrix.config.build }} -DCMAKE_PREFIX_PATH="${{ env.QTC_PATH }};${{ env.QT_PATH }}" -DBUILD_ROSTERMINAL=OFF
          cmake --build build --target package

      - name: upload plugin spec
        if: ${{ matrix.config.name == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: plugin_archive_artifact_spec
          if-no-files-found: error
          path: |
            ./build/src/project_manager/ROSProjectManager.json

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin_archive_artifact_${{ matrix.config.name }}
          if-no-files-found: error
          path: |
            ./build/qtcreator-plugin-ros-*-*-*.zip

      - name: install Qt Creator DEB package
        if: runner.os == 'Linux'
        run: |
          wget $(./packaging/format-deb-url.py) --directory-prefix=${GITHUB_WORKSPACE}/build
          sudo apt install --no-install-recommends ${GITHUB_WORKSPACE}/build/qtcreator-opensource-linux-*-*.deb

      - name: generate plugin DEB package
        if: runner.os == 'Linux'
        run: |
          cd build
          cpack -G DEB

      - name: upload artifact (DEB)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: plugin_archive_artifact_${{ matrix.config.name }}_deb
          if-no-files-found: error
          path: |
            ./build/qtcreator-opensource-linux-*-*.deb
            ./build/qtcreator-plugin-ros_*_*.deb
            ./build/qtcreator-plugin-ros-dbgsym_*_*.ddeb

  release:
    name: create release
    if: contains(github.ref, '/tags/')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          pattern: plugin_archive_artifact_*
          merge-multiple: true
          path: ./

      - name: create release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            qtcreator-opensource-linux-*-*.deb
            qtcreator-plugin-ros_*_*.deb
            qtcreator-plugin-ros-dbgsym_*_*.ddeb
            qtcreator-plugin-ros-*-Linux-x86_64.zip
            qtcreator-plugin-ros-*-Linux-aarch64.zip
            qtcreator-plugin-ros-*-Darwin-arm64.zip
            qtcreator-plugin-ros-*-Windows-AMD64.zip
            qtcreator-plugin-ros-*-Windows-ARM64.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
